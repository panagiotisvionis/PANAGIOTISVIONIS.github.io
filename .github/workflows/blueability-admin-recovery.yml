name: BlueAbility admin password recovery

on:
  push:
    paths:
      - '.github/workflows/blueability-admin-recovery.yml'

permissions:
  contents: read

jobs:
  send-recovery:
    runs-on: ubuntu-latest
    steps:
      - name: Send official Supabase recovery email
        shell: bash
        run: |
          set -euo pipefail
          APP="$(curl -fsSL 'https://raw.githubusercontent.com/panagiotisvionis/PANAGIOTISVIONIS.github.io/main/docs/blueability/index.html')"
          SUPABASE_URL="$(printf '%s' "$APP" | grep -oE 'https://[a-z0-9]+\.supabase\.co' | head -1)"
          PUBLISHABLE_KEY="$(printf '%s' "$APP" | grep -oE 'sb_publishable_[A-Za-z0-9._-]+' | head -1)"
          PAYLOAD="$(jq -nc --arg email 'panagiotisvionis@gmail.com' '{email:$email}')"
          CODE="$(curl -sS -o /tmp/recovery-response -w '%{http_code}' -X POST "$SUPABASE_URL/auth/v1/recover?redirect_to=https%3A%2F%2Fpanagiotisvionis.github.io%2Fblueability%2F" -H "apikey: $PUBLISHABLE_KEY" -H 'Content-Type: application/json' --data "$PAYLOAD")"
          echo "Supabase recovery request HTTP $CODE"
          test "$CODE" = '200'
