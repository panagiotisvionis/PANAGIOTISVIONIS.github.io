name: Deploy BlueAbility

on:
  push:
    paths:
      - 'scripts/blueability_runtime_hotfix.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply deterministic runtime fix
        run: python3 scripts/blueability_runtime_hotfix.py
      - name: Validate BlueAbility production runtime
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/blueability/premium.js
          python3 - <<'PY'
          from pathlib import Path
          import re

          premium = Path('docs/blueability/premium.js').read_text(encoding='utf-8')
          index = Path('docs/blueability/index.html').read_text(encoding='utf-8')

          for name, text in [('premium.js', premium), ('index.html', index)]:
              if re.search(r'(?m)^\s*community=async function', text):
                  raise SystemExit(f'undeclared community assignment remains in {name}')
              if 'const community=async function' not in text:
                  raise SystemExit(f'declared community function missing in {name}')

          if 'BLUEABILITY_RUNTIME_HOTFIX_V4_START' not in index:
              raise SystemExit('runtime fallback missing')
          if 'Κανονική διαχείριση' not in index:
              raise SystemExit('admin label missing')

          m = re.search(r'<script type="module">(.*?)</script>', index, re.S)
          if not m:
              raise SystemExit('module script missing')
          Path('/tmp/blueability.mjs').write_text(m.group(1), encoding='utf-8')
          PY
          node --check /tmp/blueability.mjs
      - name: Commit verified runtime fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/blueability/index.html docs/blueability/premium.js
          if git diff --cached --quiet; then
            echo 'No production change needed.'
            exit 0
          fi
          git commit -m 'Fix BlueAbility premium runtime crash'
          git push
