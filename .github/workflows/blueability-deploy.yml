name: Deploy BlueAbility

on:
  push:
    paths:
      - '.github/workflows/blueability-deploy.yml'
      - 'scripts/blueability_runtime_hotfix.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply runtime hotfix
        run: python3 scripts/blueability_runtime_hotfix.py
      - name: Validate production module
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('docs/blueability/index.html').read_text(encoding='utf-8')
          m=re.search(r'<script type="module">(.*?)</script>',s,re.S)
          if not m:
              raise SystemExit('module script missing')
          Path('/tmp/blueability.mjs').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/blueability.mjs
          grep -q 'BLUEABILITY_RUNTIME_HOTFIX_V4_START' docs/blueability/index.html
          grep -q 'Κανονική διαχείριση' docs/blueability/index.html
      - name: Commit production hotfix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/blueability/index.html
          if git diff --cached --quiet; then
            echo 'No production change needed.'
            exit 0
          fi
          git commit -m 'Fix BlueAbility blank premium dashboard'
          git push
