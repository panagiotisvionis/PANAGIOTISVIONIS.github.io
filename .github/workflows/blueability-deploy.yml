name: Deploy BlueAbility

on:
  push:
    paths:
      - '.blueability-deploy/**'
      - '.github/workflows/blueability-deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply and verify BlueAbility role-testing build
        shell: bash
        run: |
          set -euo pipefail
          BASE_EXPECTED='876b386b79519f96c9f9d320113a2285839c2295'
          FINAL_EXPECTED='698c3e67f1367e65f9aceef53dbce8b13e2ce8b4'
          BASE_ACTUAL="$(git hash-object docs/blueability/index.html)"
          echo "Base expected: $BASE_EXPECTED"
          echo "Base actual:   $BASE_ACTUAL"
          if [ "$BASE_ACTUAL" = "$FINAL_EXPECTED" ]; then
            echo 'Role-testing build already present.'
            exit 0
          fi
          test "$BASE_ACTUAL" = "$BASE_EXPECTED"
          cat .blueability-deploy/v5patch_00 .blueability-deploy/v5patch_01 .blueability-deploy/v5patch_02 | tr -d '\n\r' | base64 -d | gzip -d > /tmp/blueability-v5.patch
          patch docs/blueability/index.html < /tmp/blueability-v5.patch
          grep -q 'Demo · Μαθητής' docs/blueability/index.html
          grep -q 'function setDemo(type)' docs/blueability/index.html
          grep -q 'Οι ενέργειες είναι προσωρινές και δεν αλλάζουν τα πραγματικά δεδομένα.' docs/blueability/index.html
          grep -q "async function savePrefs(){if(!S.user||isDemo())return;" docs/blueability/index.html
          FINAL_ACTUAL="$(git hash-object docs/blueability/index.html)"
          echo "Final expected: $FINAL_EXPECTED"
          echo "Final actual:   $FINAL_ACTUAL"
          test "$FINAL_ACTUAL" = "$FINAL_EXPECTED"
      - name: Commit production build
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/blueability/index.html
          if git diff --cached --quiet; then
            echo 'No deployment change needed.'
            exit 0
          fi
          git commit -m 'Add BlueAbility admin role testing'
          git push
