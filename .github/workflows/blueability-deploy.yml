name: Deploy BlueAbility

on:
  push:
    paths:
      - '.github/workflows/blueability-deploy.yml'
      - 'docs/blueability/premium.js'
      - 'docs/blueability/premium.css'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inline premium application layer into the main module
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/blueability/index.html
          test -f docs/blueability/premium.js
          test -f docs/blueability/premium.css
          node --check docs/blueability/premium.js
          python3 - <<'PY'
          from pathlib import Path
          import re

          index_path = Path('docs/blueability/index.html')
          premium_path = Path('docs/blueability/premium.js')
          s = index_path.read_text(encoding='utf-8')
          premium = premium_path.read_text(encoding='utf-8').strip()

          start = '/* BLUEABILITY_PREMIUM_INLINE_START */'
          end = '/* BLUEABILITY_PREMIUM_INLINE_END */'

          # Remove an earlier inline build if this workflow is re-run.
          s = re.sub(
              r'\n?/\* BLUEABILITY_PREMIUM_INLINE_START \*/.*?/\* BLUEABILITY_PREMIUM_INLINE_END \*/\n?',
              '\n',
              s,
              flags=re.S,
          )

          # The base application is an ES module. A separate classic script cannot
          # access its module-scoped S/sb/render functions, which is why only the
          # old UI was visible. Remove the external script and place the premium
          # layer inside the same module scope.
          s = re.sub(
              r'<script\s+src=["\']\./premium\.js(?:\?[^"\']*)?["\']\s*></script>',
              '',
              s,
              flags=re.I,
          )

          block = f"\n{start}\n{premium}\n{end}\n"
          anchor = 'await boot();'
          pos = s.rfind(anchor)
          if pos < 0:
              raise SystemExit('Could not find await boot() anchor in BlueAbility module')
          s = s[:pos] + block + s[pos:]

          # Force a fresh stylesheet fetch too.
          s = re.sub(
              r'\./premium\.css\?v=[^"\']+',
              './premium.css?v=20260915pro3',
              s,
          )

          index_path.write_text(s, encoding='utf-8')
          PY

          grep -q 'BLUEABILITY_PREMIUM_INLINE_START' docs/blueability/index.html
          grep -q 'Κανονική διαχείριση' docs/blueability/index.html
          grep -q 'Κοινότητα BlueAbility' docs/blueability/index.html
          if grep -q '<script src="./premium.js' docs/blueability/index.html; then
            echo 'External premium.js loader still present' >&2
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re
          s = Path('docs/blueability/index.html').read_text(encoding='utf-8')
          m = re.search(r'<script type="module">(.*?)</script>', s, re.S)
          if not m:
              raise SystemExit('Module script not found')
          Path('/tmp/blueability-production.mjs').write_text(m.group(1), encoding='utf-8')
          PY
          node --check /tmp/blueability-production.mjs

      - name: Commit corrected production build
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/blueability/index.html
          if git diff --cached --quiet; then
            echo 'No deployment change needed.'
            exit 0
          fi
          git commit -m 'Fix BlueAbility premium module integration'
          git push
