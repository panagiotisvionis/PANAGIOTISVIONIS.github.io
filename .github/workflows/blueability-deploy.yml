name: Deploy BlueAbility

on:
  push:
    paths:
      - '.blueability-deploy/**'
      - '.github/workflows/blueability-deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild BlueAbility production HTML
        shell: bash
        run: |
          mkdir -p docs/blueability
          cat .blueability-deploy/chunk*.b64 | tr -d '\n\r' | base64 -d > docs/blueability/index.html
          test -s docs/blueability/index.html
          grep -q 'etnuvuhxxbhvebosicqf' docs/blueability/index.html
          grep -q 'BlueAbility' docs/blueability/index.html
      - name: Commit production build
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/blueability/index.html
          if git diff --cached --quiet; then
            echo 'No deployment change needed.'
            exit 0
          fi
          git commit -m 'Deploy BlueAbility production app'
          git push
