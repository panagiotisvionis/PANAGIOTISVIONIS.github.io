name: Deploy BlueAbility

on:
  push:
    paths:
      - '.blueability-deploy/**'
      - '.github/workflows/blueability-deploy.yml'
      - 'docs/blueability/premium.css'
      - 'docs/blueability/premium.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply BlueAbility premium experience
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/blueability/premium.css
          test -f docs/blueability/premium.js
          node --check docs/blueability/premium.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/blueability/index.html')
          s=p.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="./premium.css?v=20260915">'
          js='<script src="./premium.js?v=20260915"></script>'
          if css not in s:
              s=s.replace('</head>',css+'</head>',1)
          if js not in s:
              s=s.replace('</body>',js+'</body>',1)
          s=s.replace('<span>10 ενότητες</span>','<span>18 ενότητες</span>')
          s=s.replace('Η θάλασσα σε 10 ενότητες.','Η θάλασσα σε 18 ενότητες.')
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'premium.css?v=20260915' docs/blueability/index.html
          grep -q 'premium.js?v=20260915' docs/blueability/index.html
          grep -q 'Η θάλασσα σε 18 ενότητες.' docs/blueability/index.html
          grep -q 'Demo · Μαθητής' docs/blueability/index.html
          rm -f .blueability-deploy/premium_assets_00 .blueability-deploy/pd_09
      - name: Commit production build
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A docs/blueability .blueability-deploy
          if git diff --cached --quiet; then
            echo 'No deployment change needed.'
            exit 0
          fi
          git commit -m 'Upgrade BlueAbility premium visuals and content'
          git push
