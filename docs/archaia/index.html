<style>

body{margin:0;background:

.shell{min-height:100vh}

 height:76px;background:rgba(255,255,255,.94);backdrop-filter:blur(16px);

 align-items:center;padding:0 34px;position:sticky;top:0;z-index:40

 background:

}

.fi-bust{background:linear-gradient(145deg,#ded9cf,#9b948a);display:grid;place-items:center}.fi-bust:before{content:"Ω";font:700 62px "Libre Baskerville";color:#f7f3e8;text-shadow:0 6px 20px #554d4470}

.feature-body{padding:18px 16px;display:flex;flex-direction:column}.feature h3{font-size:18px;color:var(--ink);margin:2px 0 8px}.feature p{font-size:12px;color:#6e7d8a;line-height:1.55;margin:0}.feature .go{margin-top:auto;align-self:flex-end;width:31px;height:31px;border-radius:50%;background:#f1ede6;display:grid;place-items:center;color:var(--ink)}

.login-panel{background:#f7f5ef;display:grid;place-items:center;padding:30px}.loginbox{width:min(450px,100%);background:white;border:1px solid var(--line);border-radius:24px;padding:30px;box-shadow:var(--shadow)}.loginbox h2{font-size:28px;color:var(--ink);margin:0 0 7px}.quick-login{display:grid;gap:9px;margin-top:16px}

.memory-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.memory-card{min-height:76px;border:1px solid #d8e0e3;border-radius:12px;background:white;padding:10px;display:grid;place-items:center;text-align:center;font-size:12px;font-weight:800;color:#28445f}
.memory-card.open{background:#eef4f6}.memory-card.matched{background:#eaf5ed;border-color:#7aa286}
.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.compare-box{background:#faf9f6;border:1px solid #e6e0d7;border-radius:14px;padding:15px}
.compare-box h4{margin:0 0 8px;font:700 16px "Libre Baskerville";color:var(--ink)}
.mini-table{width:100%;border-collapse:collapse;margin-top:12px}.mini-table th,.mini-table td{border-bottom:1px solid #e9ecec;padding:9px 7px;text-align:left;font-size:11px}.mini-table th{color:#61707c}
.reveal{background:#f3f7f8;border:1px solid #dbe4e7;border-radius:12px;padding:12px;margin-top:10px}
.reveal summary{font-weight:800;color:var(--ink);cursor:pointer}.reveal div{margin-top:8px;color:#65737f;font-size:12px;line-height:1.6}
@media(max-width:780px){.interactive-strip,.sort-game,.compare-grid{grid-template-columns:1fr}.memory-grid{grid-template-columns:repeat(2,1fr)}.interactive-card{min-height:0}}


.brand-logo{height:50px;max-width:220px;width:auto;object-fit:contain;display:block}
.quizq label.answer-correct{background:#e8f6ec;border:1px solid #73a986;color:#245b35}
.quizq label.answer-wrong{background:#fff0ef;border:1px solid #d9918a;color:#8b2f2a}
.quizq label.answer-correct input{accent-color:#2f8b4b}.quizq label.answer-wrong input{accent-color:#c94138}
.progress-ring{--p:0;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--blue) calc(var(--p)*1%),#e2e8eb 0);position:relative;flex:none}
.progress-ring:before{content:"";position:absolute;width:44px;height:44px;border-radius:50%;background:white}.progress-ring b{position:relative;z-index:1;font-size:11px;color:var(--ink)}
.unit-progress-card{display:flex;align-items:center;gap:13px;background:white;border:1px solid var(--line);border-radius:15px;padding:12px 14px;margin:12px 0}.unit-progress-card strong{display:block;color:var(--ink);font-size:12px}.unit-progress-card span{font-size:10px;color:#74818b}
.overall-progress{background:linear-gradient(135deg,#102f50,#174e78);color:white;border-radius:20px;padding:18px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}.overall-progress .progress-ring:before{background:#153f65}.overall-progress .progress-ring b{color:white}.overall-progress p{margin:4px 0 0;color:#d9e5ed;font-size:11px}
.reward-card{background:linear-gradient(135deg,#fffaf0,#f2e5c9);border:1px solid #e1cfaa;border-radius:18px;padding:17px;display:flex;gap:14px;align-items:center}.reward-medal{width:48px;height:48px;border-radius:50%;background:linear-gradient(145deg,#d7aa5a,#8c632b);display:grid;place-items:center;color:white;font-size:23px}.reward-card h3{margin:0 0 4px;font-size:17px;color:var(--ink)}.reward-card p{margin:0;color:#6c7680;font-size:11px}
.theory-panel{background:linear-gradient(180deg,#fbfaf6,#f4f0e7);border:1px solid #e4dac8;border-radius:17px;padding:17px;margin:14px 0}.theory-panel h3{font-size:19px;color:var(--ink);margin:3px 0 10px}.theory-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.theory-point{background:rgba(255,255,255,.8);border:1px solid #e6dfd4;border-radius:12px;padding:11px}.theory-point b{display:block;font-size:11px;color:#8a6538;margin-bottom:5px}.theory-point span{font-size:11px;color:#5d6b77;line-height:1.45}
.unit-card-progress{margin-top:11px}.unit-card-progress .progress{height:5px;background:rgba(255,255,255,.22)}.unit-card-progress .progress i{background:#f0d39d}.unit-card-progress small{display:block;margin-top:5px;color:#f0e6d7;font-size:9px}
.badge-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.badge{background:white;border:1px solid #e4e8ea;border-radius:14px;padding:12px;text-align:center}.badge.locked{opacity:.45;filter:grayscale(1)}.badge i{font-style:normal;font-size:24px}.badge b{display:block;font-size:11px;color:var(--ink);margin-top:5px}.badge span{display:block;font-size:9px;color:#77838c;margin-top:3px}
@media(max-width:780px){.brand-logo{height:44px;max-width:190px}.theory-grid{grid-template-columns:1fr}.overall-progress{grid-template-columns:58px 1fr}.badge-grid{grid-template-columns:repeat(2,1fr)}}


.logo-home{border:0;background:transparent;padding:0;display:flex;align-items:center;cursor:pointer}
.account{position:relative}.avatar-btn{border:0;background:transparent;padding:0;border-radius:50%}
.profile-menu{position:absolute;right:0;top:58px;width:310px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow);z-index:80}
.profile-menu[hidden]{display:none}.profile-head{display:flex;align-items:center;gap:11px;padding-bottom:11px;border-bottom:1px solid #edf0f1}.profile-head .avatar{flex:none}.profile-meta b{font-size:13px}.profile-meta span{display:block;font-size:10px;color:#77838d}
.profile-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:11px 0}.profile-stat{background:#f6f8f8;border-radius:11px;padding:9px;text-align:center}.profile-stat b{display:block;font-size:15px;color:var(--ink)}.profile-stat span{font-size:8px;color:#79858d;text-transform:uppercase}
.profile-actions{display:grid;gap:5px}.profile-actions button{border:0;background:transparent;border-radius:10px;padding:10px;text-align:left;color:#405366;font-weight:700;font-size:12px}.profile-actions button:hover{background:#f3f6f7}
.setting-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 2px;border-top:1px solid #edf0f1;font-size:11px;color:#536574}.setting-row input{width:18px;height:18px}
.live-hero{background:linear-gradient(135deg,#102f50,#174f78);color:white;border-radius:22px;padding:20px;margin-bottom:14px;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}.live-hero h2{color:white;margin:3px 0 7px}.live-hero p{color:#d8e4ec;margin:0;font-size:12px;line-height:1.55}.live-status{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.live-pill{font-size:10px;font-weight:800;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.18);padding:6px 8px;border-radius:999px}
.classroom-grid{display:grid;grid-template-columns:230px minmax(0,1fr) 300px;gap:14px}.classroom-main{min-width:0}
.live-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.live-toolbar button{border:1px solid #d8e1e5;background:white;color:#3c5165;border-radius:10px;padding:9px 11px;font-weight:800;font-size:11px}.live-toolbar button.on{background:#eaf1f6;border-color:#7d9db7;color:#183c61}
.lesson-flow{display:grid;gap:8px}.flow-step{display:grid;grid-template-columns:30px 1fr auto;gap:9px;align-items:center;border:1px solid #e2e7e9;border-radius:12px;padding:10px}.flow-step i{width:28px;height:28px;border-radius:50%;background:#eef3f5;display:grid;place-items:center;font-style:normal;color:#24425f;font-weight:800}.flow-step b{font-size:11px;color:#263f55}.flow-step span{font-size:9px;color:#7a858d}.flow-step button{border:0;background:#f0f4f5;border-radius:8px;padding:7px 8px;font-size:9px;font-weight:800;color:#29465e}
.activity-picker{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}.activity-option{border:1px solid #dce3e6;background:#fff;border-radius:12px;padding:11px;text-align:left}.activity-option b{display:block;font-size:11px;color:#29455e}.activity-option span{display:block;font-size:9px;color:#7b8790;margin-top:3px}
.student-live-card{text-align:center;padding:32px 12px}.student-live-card .bigicon{font-size:40px}.student-live-card h3{font-size:22px;margin:8px 0}.student-live-card p{font-size:12px;color:#74818b;line-height:1.55}
.bbb-note{font-size:10px;line-height:1.5;color:#6e7b85;background:#f7f9f9;border:1px dashed #ccd8de;border-radius:10px;padding:9px;margin-top:10px}
body.large-text{font-size:18px}body.large-text .lesson-card p,body.large-text .notice{font-size:14px}
@media(max-width:900px){.classroom-grid{grid-template-columns:1fr}.classroom-grid .panel{margin-bottom:0}.profile-menu{right:-6px;width:min(310px,calc(100vw - 24px))}.live-hero{grid-template-columns:1fr}.activity-picker{grid-template-columns:1fr}}


.auth-tabs{display:flex;gap:7px;background:#f2f5f6;padding:5px;border-radius:12px;margin:15px 0}.auth-tabs button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px;font-weight:800;color:#6b7a85}.auth-tabs button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(16,47,80,.08)}
.auth-form{display:grid;gap:10px}.auth-form .field{margin:0}.auth-link{border:0;background:transparent;color:#1e608e;font-weight:800;font-size:11px;padding:4px 0;cursor:pointer}.auth-message{margin-top:10px}
.approval-list{display:grid;gap:9px}.approval-item{border:1px solid #e0e6e8;border-radius:13px;padding:12px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.approval-item b{font-size:12px;color:var(--ink)}.approval-item span{display:block;font-size:10px;color:#78848c;margin-top:3px}.approval-actions{display:flex;gap:6px}.approval-actions button{border:0;border-radius:8px;padding:7px 9px;font-size:9px;font-weight:800}.approve{background:#e5f3e9;color:#2f7041}.reject{background:#fbe9e7;color:#9b3f37}
.progress-matrix{overflow:auto;border:1px solid #e0e6e8;border-radius:15px;background:#fff}.progress-matrix table{border-collapse:collapse;min-width:1250px;width:100%}.progress-matrix th,.progress-matrix td{padding:8px 7px;border-bottom:1px solid #edf0f1;border-right:1px solid #f0f2f3;text-align:center;font-size:9px}.progress-matrix th{position:sticky;top:0;background:#f6f8f8;z-index:2;color:#536675}.progress-matrix th:first-child,.progress-matrix td:first-child{position:sticky;left:0;background:#fff;text-align:left;z-index:1;min-width:150px}.progress-matrix th:first-child{background:#f6f8f8;z-index:3}.score-cell{display:inline-grid;place-items:center;width:31px;height:24px;border-radius:7px;font-weight:800}.score-good{background:#e6f4ea;color:#2e7041}.score-mid{background:#fff5df;color:#90641e}.score-low{background:#fbeae8;color:#9c4038}.score-none{background:#f1f3f4;color:#9aa3a8}


/* Generated login artwork */
.login-visual{background-image:linear-gradient(90deg,rgba(7,30,49,.18),rgba(7,30,49,.06)),url('./login-bg.jpg')!important;background-size:cover!important;background-position:center!important}
.login-visual:before{background:linear-gradient(180deg,rgba(5,24,41,.03) 0%,rgba(5,24,41,.18) 62%,rgba(5,24,41,.52) 100%)!important}

/* Shared branded hero artwork: login + role home */
.hero{position:relative;overflow:hidden;background-image:linear-gradient(90deg,rgba(10,37,61,.91) 0%,rgba(10,37,61,.76) 45%,rgba(10,37,61,.44) 100%),url('./login-bg.jpg')!important;background-size:cover!important;background-position:center 46%!important}
.hero:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(7,29,48,.05),rgba(7,29,48,.26))}
.hero .hero-in{position:relative;z-index:1}
@media(max-width:700px){.hero{background-position:58% center!important}}

/* Login layout: image only on left 2/3, auth form on right 1/3 */
.login{display:grid!important;grid-template-columns:minmax(0,2fr) minmax(390px,1fr)!important;min-height:100vh!important;background:#f7f5ef}
.login-visual{min-height:100vh!important;padding:0!important;background-image:url('./login-bg.jpg')!important;background-size:cover!important;background-position:center center!important}
.login-visual>div{display:none!important}
.login-visual:before{background:transparent!important}
.login-panel{min-height:100vh!important;padding:28px!important;display:flex!important;align-items:center!important;justify-content:center!important;background:#f8f6f0}
.loginbox{width:min(100%,480px)!important}
@media(max-width:900px){.login{grid-template-columns:1fr!important}.login-visual{min-height:38vh!important}.login-panel{min-height:62vh!important;padding:18px!important}}

',3],['🦉','Χάλκινη Κουκουβάγια',6],['🎵','Αργυρή Λύρα',9],['📜','Σφραγίδα Γνώσης',12],['📜','Χρυσός Πάπυρος',15],['🏆','Χρυσό Στεφάνι του Λόγου',18]].map(function(x){return '<div class="badge '+(r.count>=x[2]?'':'locked')+'"><i>'+x[0]+'</i><b>'+x[1]+'</b><span>'+x[2]+' ενότητες</span></div>'}).join("")+'</div></section></section></main>'+mobile()+'</div>'}

function content(){var overall=overallPercent(),r=rewardInfo();var cards=units.map(function(u){var tags=[];if(u.lex&&u.lex!=="—")tags.push("Λεξιλόγιο");if(u.etym&&u.etym!=="—")tags.push("Ετυμολογία");if(u.gram)tags.push("Γραμματική / Σύνταξη");var pct=unitPercent(u.n);return '<article class="unit-tile" style="--unit-img:url(&quot;'+unitImage(u)+'&quot;)" onclick="openUnit('+u.n+')"><div class="unit-copy"><div class="unit-no">ΕΝΟΤΗΤΑ '+u.n+'</div><h3>'+u.title+'</h3><p>'+u.source+'</p><div class="unit-topics">'+tags.slice(0,3).map(function(t){return '<span>'+t+'</span>'}).join("")+'</div><div class="unit-card-progress"><div class="progress"><i style="width:'+pct+'%"></i></div><small>'+pct+'% ολοκλήρωση</small></div></div></article>'}).join("");return '<div class="fade">'+header()+'<main class="main" style="margin-top:0;padding-top:30px"><section class="section" style="margin-top:0"><div class="section-head"><div><div class="tag">ΠΛΗΡΕΣ ΠΡΟΓΡΑΜΜΑ ΒΙΒΛΙΟΥ</div><h2>18 ενότητες Αρχαίας Ελληνικής Γλώσσας</h2><p>Θεωρία, παιχνίδι, εξάσκηση και αξιολόγηση σε κάθε ενότητα.</p></div></div><div class="overall-progress" style="margin-bottom:16px"><div class="progress-ring" style="--p:'+overall+'"><b>'+overall+'%</b></div><div><b>'+r.count+'/18 ενότητες ολοκληρωμένες • '+r.xp+' XP</b><p>Τρέχουσα επιβράβευση: '+r.name+'. Στις 18/18 ξεκλειδώνει το Χρυσό Στεφάνι του Λόγου.</p></div></div><div class="unit-grid">'+cards+'</div></section></main>'+mobile()+'</div>'}
function done(id){return !!load().progress[id]}function mark(id){var d=load();d.progress[id]=true;save(d);render()}
function foot(id){return '<button class="btn '+(done(id)?"gold":"light")+'" onclick="mark(\''+id+'\')">'+(done(id)?"Ολοκληρώθηκε ✓":"Ολοκλήρωσα αυτό το βήμα")+'</button>'}
function lesson1(){return '<section class="lesson-card" id="step1"><div class="tag">01 • Η ΓΛΩΣΣΑ ΣΤΟΝ ΧΡΟΝΟ</div><h2>Μία γλώσσα με μακρά ιστορία</h2><p>Οι παλαιότερες σωζόμενες μαρτυρίες της ελληνικής φτάνουν στις πινακίδες της Γραμμικής Β΄. Η γλώσσα δεν μένει ακίνητη· μεταβάλλεται σταδιακά μέσα στους αιώνες.</p><div class="timeline"><div class="time"><small>1450–1200 π.Χ.</small><b>Γραμμική Β΄</b></div><div class="time"><small>8ος αι. π.Χ.</small><b>Ελληνικό αλφάβητο</b></div><div class="time"><small>5ος–4ος αι. π.Χ.</small><b>Αττική</b></div><div class="time"><small>323 π.Χ.–330 μ.Χ.</small><b>Ελληνιστική Κοινή</b></div><div class="time"><small>Σήμερα</small><b>Νέα Ελληνική</b></div></div>'+foot("continuity")+'</section>'}
function lesson2(){var rows=[["ἁρμονία",["history","harmony","athlete"],"harmony"],["ἀνάλυσις",["analysis","music","Europe"],"analysis"],["ἀθλητής",["athlete","theatre","method"],"athlete"],["ἱστορία",["histoire","horizon","idea"],"histoire"]];var m=rows.map(function(r,i){return '<div class="matchrow" data-m="'+i+'" data-a="'+r[2]+'"><b>'+r[0]+'</b><div class="choices">'+r[1].map(function(c){return '<button class="choice" data-c="'+c+'">'+c+'</button>'}).join("")+'</div></div>'}).join("");return '<section class="lesson-card" id="step2"><div class="tag">02 • ΛΕΞΕΙΣ ΠΟΥ ΤΑΞΙΔΕΥΟΥΝ</div><h2>Ρίζες που περνούν από γλώσσα σε γλώσσα</h2><p>Πολλές ελληνικές λέξεις και ρίζες πέρασαν σε άλλες γλώσσες και εξακολουθούν να χρησιμοποιούνται διεθνώς.</p><div class="word-grid"><div class="word"><b>ἁρμονία → harmony</b></div><div class="word"><b>ἱστορία → histoire</b></div><div class="word"><b>ἀνάλυσις → analysis</b></div><div class="word"><b>ἀθλητής → athlete</b></div></div><div class="notice">Μικρή πρόκληση: επίλεξε για κάθε αρχαία λέξη τη σωστή διεθνή διαδρομή.</div><div class="match">'+m+'</div><div id="mm"></div><div style="margin-top:14px">'+foot("words")+'</div></section>'}
function lesson3(){return '<section class="lesson-card" id="step3"><div class="tag">03 • ΤΟ ΕΛΛΗΝΙΚΟ ΑΛΦΑΒΗΤΟ</div><h2>Από το φοινικικό σύστημα σε αλφάβητο φωνηέντων και συμφώνων</h2><p>Η ελληνική προσαρμογή του φοινικικού συστήματος επέτρεψε σαφή απόδοση φωνηέντων και συμφώνων και διαμόρφωσε ένα εξαιρετικά λειτουργικό σύστημα γραφής.</p><div class="notice">Δοκιμή ανάγνωσης: μόνο με τα σύμφωνα <b>Μ-Θ-Τ-Σ</b>, πόσο εύκολα ξεχωρίζεις «μαθητής / μαθητές / μαθητάς» χωρίς συμφραζόμενα;</div><p><b>Αρχαιότερα αλφαβητικά μνημεία:</b> η οινοχόη του Διπύλου και το ποτήρι του Νέστορος.</p>'+foot("alphabet")+'</section>'}
function lesson4(){return '<section class="lesson-card" id="step4"><div class="tag">04 • ΔΙΑΛΕΚΤΟΙ ΚΑΙ ΚΟΙΝΗ</div><h2>Ποικιλία που οδηγεί σε ευρύτερη κοινή μορφή</h2><p>Η Αρχαία Ελληνική παρουσιάζει ποικιλία διαλέκτων. Από τον 4ο αι. π.Χ. άρχισε να επικρατεί η Αττική.</p><div class="dialect-grid"><div class="dialect"><b>Ιωνική–Αττική</b><p>Ιδιαίτερη καλλιέργεια στην Αθήνα.</p></div><div class="dialect"><b>Αρκαδοκυπριακή</b><p>Αρχαία διαλεκτική ομάδα.</p></div><div class="dialect"><b>Αιολική</b><p>Θεσσαλική, Λεσβιακή, Βοιωτική.</p></div><div class="dialect"><b>Δυτική / Δωρική</b><p>Στη δωρική είναι γραμμένος ο Νόμος της Γόρτυνας.</p></div></div><div class="notice">Ίχνη σήμερα: Τσακωνική «μάτη» &lt; μάτηρ • Κρητική «χοχλιός» &lt; κοχλίας • Κυπριακή «έδοξέν μου» &lt; ἔδοξέ μοι.</div><div style="margin-top:14px">'+foot("dialects")+'</div></section>'}
function quizBox(){var d=load(),qs=quiz.map(function(q,i){return '<fieldset class="quizq"><legend>'+(i+1)+'. '+q[0]+'</legend>'+q[1].map(function(o){return '<label><input type="radio" name="q'+i+'" value="'+o.replace(/"/g,"&quot;")+'"> '+o+'</label>'}).join("")+'</fieldset>'}).join("");return '<section class="lesson-card" id="quizbox"><div class="tag">ΤΕΛΙΚΗ ΑΞΙΟΛΟΓΗΣΗ</div><h2>Έλεγχος γνώσεων — 10 ερωτήσεις</h2><p>Ολοκλήρωσε όλες τις ερωτήσεις. Στόχος επιτυχίας: 70%.</p>'+(d.quiz?'<div class="notice '+(d.quiz.passed?"good":"")+'">Τελευταία προσπάθεια: <b>'+d.quiz.score+'/10 • '+d.quiz.percent+'%</b></div>':"")+'<form id="quiz">'+qs+'<button class="btn primary" type="submit">Υποβολή αξιολόγησης</button><div id="qr"></div></form></section>'}

function safeText(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function colorQuizFieldset(fs,correct){all("label",fs).forEach(function(l){l.classList.remove("answer-correct","answer-wrong");var inp=l.querySelector("input");if(!inp)return;if(inp.value===correct)l.classList.add("answer-correct");else if(inp.checked)l.classList.add("answer-wrong");inp.disabled=true})}
function rewardToast(n){var r=rewardInfo(),final=r.count===18;return '<div class="reward-card" style="margin-top:12px"><div class="reward-medal">'+(final?'♛':'✦')+'</div><div><h3>'+(final?'Χρυσό Στεφάνι του Λόγου':'Επιβράβευση Ενότητας '+n)+'</h3><p>'+(final?'Ολοκλήρωσες επιτυχώς και τις 18 ενότητες. '+r.xp+' XP και το τελικό σήμα ολοκλήρωσης.':'+100 XP • Σύνολο '+r.xp+' XP • '+r.name)+'</p></div></div>'}
function unitProgressWidget(n){var p=unitPercent(n),s=unitState(n);return '<div class="unit-progress-card"><div class="progress-ring" style="--p:'+p+'"><b>'+p+'%</b></div><div><strong>Πρόοδος Ενότητας '+n+'</strong><span>'+(s.passed?'Ολοκληρώθηκε επιτυχώς ✓':s.quizAttempted?'Έγινε προσπάθεια στο quiz':s.game?'Ολοκληρώθηκε δραστηριότητα':'Μελέτησε τη θεωρία και παίξε τη δραστηριότητα')+'</span></div></div>'}

function theoryBeforeQuiz(u){var focus=u.lex&&u.lex!=="—"?u.lex:u.title;return '<section class="theory-panel"><div class="tag">ΘΕΩΡΙΑ ΠΡΙΝ ΑΠΟ ΤΟ QUIZ</div><h3>Τι πρέπει να θυμάσαι</h3><div class="theory-grid"><div class="theory-point"><b>ΚΕΙΜΕΝΟ / ΘΕΜΑ</b><span>'+safeText(u.source)+'</span></div><div class="theory-point"><b>ΛΕΞΙΛΟΓΙΟ / ΕΤΥΜΟΛΟΓΙΑ</b><span>'+safeText((u.lex&&u.lex!=="—"?u.lex+" • ":"")+u.etym)+'</span></div><div class="theory-point"><b>ΓΡΑΜΜΑΤΙΚΗ / ΣΥΝΤΑΞΗ</b><span>'+safeText(u.gram)+'</span></div></div><div class="mini-challenge" data-theory-game="'+u.n+'"><h4>⚡ Παιχνίδι: βρες τι ανήκει στην ενότητα</h4><div class="choices"><button type="button" class="choice theory-choice" data-correct="1">'+safeText(focus)+'</button><button type="button" class="choice theory-choice">Λατινική κλίση</button><button type="button" class="choice theory-choice">Αγγλική φωνητική</button></div><div class="theory-result"></div></div></section>'}
function submitGenericQuiz(e){e.preventDefault();var form=e.target,fs=all(".quizq",form),answered=0,score=0;fs.forEach(function(x){var checked=x.querySelector("input:checked");if(checked){answered++;if(checked.value===x.getAttribute("data-answer"))score++}});var out=el("#gqr");if(answered<fs.length){out.innerHTML='<div class="notice" style="margin-top:12px">Απάντησε και στις 5 ερωτήσεις.</div>';return false}fs.forEach(function(x){colorQuizFieldset(x,x.getAttribute("data-answer"))});var pct=Math.round(score/fs.length*100),pass=pct>=70;setUnitState(selectedUnit,{quizAttempted:true,passed:pass,score:pct});out.innerHTML='<div class="notice '+(pass?"good":"")+'" style="margin-top:12px"><b>'+score+'/5 • '+pct+'%</b><br>'+(pass?"Η ενότητα ολοκληρώθηκε με επιτυχία. +100 XP":"Οι σωστές απαντήσεις φαίνονται με πράσινο και η λανθασμένη επιλογή με κόκκινο. Δες ξανά τη θεωρία και προσπάθησε πάλι.")+'</div>'+(pass?rewardToast(selectedUnit):'');renderProgressOnly();return false}
function genericQuizBox(u){var next=unitByNo(u.n===18?1:u.n+1),alt=unitByNo(u.n>3?u.n-3:18-u.n),q=[
["Ποιος είναι ο τίτλος της Ενότητας "+u.n+";",[u.title,next.title,alt.title,"Το ταξίδι των λέξεων στον χρόνο…"],u.title],
["Ποια πηγή ή θεματική αφετηρία συνδέεται με την ενότητα;",[u.source,next.source,alt.source,"Επαναληπτικές ασκήσεις χωρίς κείμενο"],u.source],
["Ποιο είναι το λεξιλογικό ή γλωσσικό επίκεντρο;",[u.lex!=="—"?u.lex:u.gram,next.lex!=="—"?next.lex:next.gram,alt.lex!=="—"?alt.lex:alt.gram,"Λατινική φωνητική"],u.lex!=="—"?u.lex:u.gram],
["Ποιο ετυμολογικό θέμα περιλαμβάνεται;",[u.etym!=="—"?u.etym:u.gram,next.etym!=="—"?next.etym:next.gram,alt.etym!=="—"?alt.etym:alt.gram,"Αγγλική ορθογραφία"],u.etym!=="—"?u.etym:u.gram],
["Ποιος γραμματικός ή συντακτικός άξονας ανήκει στην ενότητα;",[u.gram,next.gram,alt.gram,"Νεοελληνική στιχουργική"],u.gram]
];return theoryBeforeQuiz(u)+'<section class="lesson-card" id="quizbox"><div class="tag">QUIZ • ΕΝΟΤΗΤΑ '+u.n+'</div><h2>Γρήγορος έλεγχος</h2><p>5 ερωτήσεις πάνω στους βασικούς άξονες της ενότητας.</p><form onsubmit="return submitGenericQuiz(event)">'+q.map(function(x,i){return '<fieldset class="quizq" data-answer="'+x[2].replace(/"/g,"&quot;")+'"><legend>'+(i+1)+'. '+safeText(x[0])+'</legend>'+x[1].map(function(o){return '<label><input type="radio" name="gq'+i+'" value="'+String(o).replace(/"/g,"&quot;")+'"> '+safeText(o)+'</label>'}).join("")+'</fieldset>'}).join("")+'<button class="btn primary" type="submit">Υποβολή quiz</button><div id="gqr"></div></form></section>'}

function richUnit2(){
return '<section class="lesson-card" id="unitA"><div class="tag">Α • Η ΑΓΩΓΗ ΣΤΗΝ ΑΘΗΝΑ</div><h2>Ποιοι διαμόρφωναν τον νέο Αθηναίο;</h2><p>Στα πρώτα στάδια της αγωγής συμμετείχαν η τροφός, η μητέρα, ο παιδαγωγός και ο πατέρας. Αργότερα το παιδί πήγαινε σε δασκάλους.</p><div class="interactive-strip"><div class="interactive-card"><b>γραμματιστής</b><span>Γραφή, ανάγνωση και κατανόηση των γραμμένων.</span></div><div class="interactive-card"><b>κιθαριστής</b><span>Μουσική, ρυθμός και αρμονία.</span></div><div class="interactive-card"><b>παιδοτρίβης</b><span>Γυμναστική και ενδυνάμωση του σώματος.</span></div></div><div class="notice">Στόχος της αγωγής ήταν η καλλιέργεια σώματος και ψυχής, ώστε οι νέοι να γίνουν «καλοὶ κἀγαθοί».</div></section>'+
'<section class="lesson-card" id="unitB"><div class="tag">Β • ΠΑΙΧΝΙΔΙ ΑΝΤΙΣΤΟΙΧΙΣΗΣ</div><h2>Ποιος διδάσκει τι;</h2><p>Πάτησε το κατάλληλο ζεύγος. Όταν βρεις σωστή αντιστοίχιση, και τα δύο στοιχεία κλειδώνουν.</p><div class="memory-grid" id="u2match">'+
['γραμματιστής','γραφή / ανάγνωση','κιθαριστής','μουσική / ρυθμός','παιδοτρίβης','γυμναστική','παιδαγωγός','συνοδεία / αγωγή'].map(function(x,i){return '<button class="memory-card" data-u2="'+i+'">'+x+'</button>'}).join('')+
'</div><div id="u2result"></div></section>'+
'<section class="lesson-card" id="unitC"><div class="tag">Γ • ΠΩΣ ΕΓΡΑΦΑΝ</div><h2>Από τη μεγαλογράμματη στη μικρογράμματη γραφή</h2><p>Η μικρογράμματη γραφή συνδέεται με συστηματική χρήση τόνων, πνευμάτων και κενών μεταξύ των λέξεων. Το βιβλίο αναφέρει ότι εισάγεται τον 9ο αι. μ.Χ.</p><div class="compare-grid"><div class="compare-box"><h4>Κατευθύνσεις γραφής</h4><p>Δεξιά → αριστερά</p><p>Βουστροφηδόν</p><p>Αριστερά → δεξιά</p></div><div class="compare-box"><h4>24 γράμματα</h4><p>Οι φθόγγοι της Αρχαίας Ελληνικής παριστάνονται με 24 γράμματα, όπως και στη Νέα Ελληνική.</p></div></div><details class="reveal"><summary>Μικρή πρόκληση</summary><div>Θυμήσου: στη βουστροφηδόν γραφή η κατεύθυνση εναλλάσσεται από σειρά σε σειρά.</div></details></section>'+genericQuizBox(unitByNo(2))
}
function richUnit3(){
return '<section class="lesson-card" id="unitA"><div class="tag">Α • ΕΠΑΓΓΕΛΜΑΤΑ</div><h2>Η οικονομία της αρχαίας Αθήνας</h2><p>Το κείμενο αναφέρει πολλές δραστηριότητες: ναύκληρος, έμπορος, κάπηλος, γεωργός, λιθοξόος, κεραμεύς, τέκτων και σκυτοτόμος.</p><div class="token-bank" id="u3bank">'+['ναύκληρος','ἔμπορος','κάπηλος','γεωργός','λιθοξόος','κεραμεύς','τέκτων','σκυτοτόμος'].map(function(x){return '<button class="token" data-prof="'+x+'">'+x+'</button>'}).join('')+'</div><div class="sort-game"><div class="sort-col"><h4>Θάλασσα / εμπόριο</h4><div data-zone="sea"></div></div><div class="sort-col"><h4>Γη / παραγωγή</h4><div data-zone="land"></div></div><div class="sort-col"><h4>Τεχνίτες</h4><div data-zone="craft"></div></div></div><div id="u3result"></div></section>'+
'<section class="lesson-card" id="unitB"><div class="tag">Β • ΕΤΥΜΟΛΟΓΙΑ</div><h2>Παραγωγή και σύνθεση</h2><div class="compare-grid"><div class="compare-box"><h4>Παράγωγη λέξη</h4><p>τροφή ← τρέφω</p><p>κεραμεύς ← κέραμος</p></div><div class="compare-box"><h4>Σύνθετη λέξη</h4><p>ναύκληρος ← ναῦς + κλῆρος</p><p>σκυτοτόμος ← σκῦτος + τέμνω</p></div></div><div class="notice">Ρίζα είναι το αρχικό θέμα από το οποίο μπορούν να προκύψουν συγγενικές λέξεις, συχνά με μετασχηματισμούς.</div></section>'+
'<section class="lesson-card" id="unitC"><div class="tag">Γ • ΤΟΝΟΙ ΚΑΙ ΠΝΕΥΜΑΤΑ</div><h2>Οι βασικοί κανόνες τονισμού</h2><table class="mini-table"><tr><th>Κανόνας</th><th>Παράδειγμα</th></tr><tr><td>Μακρά λήγουσα: όχι προπαραλήγουσα</td><td>ἀνθρώπου</td></tr><tr><td>Μακρά παραλήγουσα + βραχεία λήγουσα</td><td>οἶκος</td></tr><tr><td>Προπαραλήγουσα: μόνο οξεία</td><td>ἄτομον</td></tr><tr><td>Βραχεία συλλαβή: όχι περισπωμένη</td><td>τόμος</td></tr></table></section>'+genericQuizBox(unitByNo(3))
}
function richUnit4(){
return '<section class="lesson-card" id="unitA"><div class="tag">Α • ΛΟΥΚΙΑΝΟΣ</div><h2>Ένα ταξίδι επιστημονικής φαντασίας</h2><p>Ο Λουκιανός περιγράφει παράξενους Φελλόποδες που έμοιαζαν με ανθρώπους, αλλά είχαν πόδια από φελλό και κινούνταν πάνω στα κύματα χωρίς να βουλιάζουν.</p><div class="interactive-strip"><div class="interactive-card"><b>παράδοξο</b><span>Ανθρώπινη μορφή με ασυνήθιστα πόδια.</span></div><div class="interactive-card"><b>κίνηση</b><span>Πάνω στα κύματα χωρίς να βυθίζονται.</span></div><div class="interactive-card"><b>συμπεριφορά</b><span>Χαιρετούν και συνοδεύουν τους ταξιδιώτες για λίγο.</span></div></div></section>'+
'<section class="lesson-card" id="unitB"><div class="tag">Β • ΠΑΙΧΝΙΔΙ ΠΑΡΑΓΩΓΗΣ</div><h2>Υποκοριστικά, περιεκτικά, τοπικά</h2><p>Διάλεξε την κατηγορία για κάθε παράγωγο ουσιαστικό.</p><div class="token-bank" id="u4game">'+[
['ἀνθρωπάριον','υποκοριστικό'],['ἀμπελών','περιεκτικό'],['ἰατρεῖον','τοπικό'],['οἰκίδιον','υποκοριστικό'],['μυρμηκιά','περιεκτικό'],['ἐμπόριον','τοπικό']
].map(function(x,i){return '<button class="token" data-u4="'+i+'" data-answer="'+x[1]+'">'+x[0]+'</button>'}).join('')+'</div><div id="u4choices" class="choices"><button class="choice" data-cat="υποκοριστικό">υποκοριστικό</button><button class="choice" data-cat="περιεκτικό">περιεκτικό</button><button class="choice" data-cat="τοπικό">τοπικό</button></div><div id="u4result"></div></section>'+
'<section class="lesson-card" id="unitC"><div class="tag">Γ • Β΄ ΚΛΙΣΗ</div><h2>Οι βασικές καταλήξεις</h2><table class="mini-table"><tr><th>Πτώση</th><th>αρσ./θηλ.</th><th>ουδέτερο</th></tr><tr><td>Ονομ. εν.</td><td>-ος</td><td>-ον</td></tr><tr><td>Γεν. εν.</td><td>-ου</td><td>-ου</td></tr><tr><td>Δοτ. εν.</td><td>-ῳ</td><td>-ῳ</td></tr><tr><td>Αιτ. εν.</td><td>-ον</td><td>-ον</td></tr><tr><td>Ονομ. πληθ.</td><td>-οι</td><td>-α</td></tr></table><div class="notice">Η ενότητα περιλαμβάνει επίσης το άρθρο και τις προσωπικές αντωνυμίες.</div></section>'+genericQuizBox(unitByNo(4))
}
function richUnit5(){
return '<section class="lesson-card" id="unitA"><div class="tag">Α • Η ΑΤΤΙΚΗ ΓΗ</div><h2>Ποιοι πόροι στηρίζουν την ευημερία;</h2><p>Ο Ξενοφών επισημαίνει το ήπιο κλίμα, την εύφορη γη, τη θάλασσα, τον άφθονο λίθο και τα μεταλλεία αργύρου.</p><div class="interactive-strip"><div class="interactive-card"><b>κλίμα</b><span>Ήπιες εποχές και μεγάλη διάρκεια παραγωγής.</span></div><div class="interactive-card"><b>λίθος</b><span>Υλικό για ναούς, βωμούς και αγάλματα.</span></div><div class="interactive-card"><b>ἄργυρος</b><span>Υπόγειος πλούτος της Αττικής.</span></div></div></section>'+
'<section class="lesson-card" id="unitB"><div class="tag">Β • ΛΕΞΙΛΟΓΙΟ ΤΗΣ ΓΗΣ</div><h2>Ομόρριζες και σύνθετες λέξεις</h2><div class="token-bank">'+['γεωργός','γεωγράφος','γεωμετρία','υπόγειος','μεσόγειος','γεώτρηση','γεωλόγος','γήπεδο'].map(function(x){return '<span class="token">'+x+'</span>'}).join('')+'</div><div class="notice">Το λεξιλογικό δίκτυο της λέξης γῆ δείχνει πόσο παραγωγική παραμένει η ρίζα στη Νέα Ελληνική.</div></section>'+
'<section class="lesson-card" id="unitC"><div class="tag">Γ • ΕΝΕΣΤΩΤΑΣ ΚΑΙ ΜΕΛΛΟΝΤΑΣ</div><h2>Ο χρονικός χαρακτήρας -σ-</h2><p>Ο μέλλοντας έχει τις ίδιες βασικές καταλήξεις με τον ενεστώτα, με προσθήκη -σ- πριν από τις καταλήξεις.</p><div class="compare-grid"><div class="compare-box"><h4>Ενεστώτας</h4><p>τοξεύω</p><p>τοξεύεις</p><p>τοξεύει</p></div><div class="compare-box"><h4>Μέλλοντας</h4><p>τοξεύσω</p><p>τοξεύσεις</p><p>τοξεύσει</p></div></div><details class="reveal"><summary>Τι συμβαίνει στα αφωνόληκτα;</summary><div>Χειλικά + σ → ψ, ουρανικά + σ → ξ, ενώ ο οδοντικός χαρακτήρας αποβάλλεται και μένει το σ.</div></details></section>'+genericQuizBox(unitByNo(5))
}
function richUnit6(){
return '<section class="lesson-card" id="unitA"><div class="tag">Α • ΜΥΘΟΣ ΤΟΥ ΑΙΣΩΠΟΥ</div><h2>Η ομορφιά δεν είναι το παν</h2><p>Το ελάφι θαυμάζει τα κέρατά του και υποτιμά τα λεπτά του πόδια. Όμως τα πόδια το βοηθούν να σωθεί, ενώ τα κέρατα μπλέκονται στο δάσος και γίνονται η αιτία της παγίδευσής του.</p><div class="compare-grid"><div class="compare-box"><h4>Αυτό που επαινούσε</h4><p>Τα κέρατα — όμορφα, εντυπωσιακά.</p></div><div class="compare-box"><h4>Αυτό που το έσωζε</h4><p>Τα πόδια — γρήγορα και λειτουργικά.</p></div></div><div class="notice">Ο μύθος αντιπαραθέτει την εξωτερική εμφάνιση με τη χρησιμότητα.</div></section>'+

}

return '<section class="lesson-card"><div class="tag">ΔΙΑΔΡΑΣΤΙΚΗ ΔΡΑΣΤΗΡΙΟΤΗΤΑ</div><h2>'+title+'</h2><p>Πάτησε τις κάρτες για να αποκαλύψεις τη βασική έννοια.</p><div class="memory-grid">'+items.map(function(x){return '<button class="memory-card concept-card" onclick="this.classList.toggle(\'open\');this.innerHTML=this.classList.contains(\'open\')?this.getAttribute(\'data-back\'):this.getAttribute(\'data-front\')" data-front="'+x[0]+'" data-back="'+x[1]+'">'+x[0]+'</button>'}).join('')+'</div></section>'
}
function richUnit7(){
return '<section class="lesson-card"><div class="tag">Α • ΓΟΡΔΙΟΣ ΔΕΣΜΟΣ</div><h2>Ένα πρόβλημα χωρίς ορατή αρχή και τέλος</h2><p>Στο Γόρδιον υπήρχε η άμαξα του Γορδίου. Η παράδοση έλεγε ότι όποιος έλυνε τον δεσμό της θα γινόταν κύριος της Ασίας. Ο Αλέξανδρος, αδυνατώντας να βρει συμβατική λύση, σύμφωνα με μία εκδοχή τον έκοψε με το ξίφος.</p><div class="interactive-strip"><div class="interactive-card"><b>1. Πρόκληση</b><span>Ούτε αρχή ούτε τέλος του δεσμού φαινόταν.</span></div><div class="interactive-card"><b>2. Απόφαση</b><span>Ο Αλέξανδρος δεν ήθελε να τον αφήσει άλυτο.</span></div><div class="interactive-card"><b>3. Λύση</b><span>Η αφήγηση προβάλλει την αποφασιστικότητά του.</span></div></div><details class="reveal"><summary>Υπήρχε και άλλη εκδοχή;</summary><div>Ναι. Το βιβλίο σημειώνει ότι, σύμφωνα με τον Αριστόβουλο, ο Αλέξανδρος αφαίρεσε το ξύλινο καρφί που συγκρατούσε τον δεσμό.</div></details></section>'+
conceptGame('Οικογένεια λέξεων: ζευγνύω',[['ζεῦξις','ενέργεια σύνδεσης'],['ζεῦγμα','μέσο / αποτέλεσμα σύνδεσης'],['ζεῦγος','δύο συνδεδεμένα στοιχεία'],['διάζευξις','χωρισμός / διάζευξη']])+
'<section class="lesson-card"><div class="tag">Γ • ΙΣΤΟΡΙΚΟΙ ΧΡΟΝΟΙ</div><h2>Η αύξηση δείχνει παρελθόν</h2><div class="compare-grid"><div class="compare-box"><h4>Συλλαβική αύξηση</h4><p>λύω → ἔλυον</p><p>γράφω → ἔγραφον</p></div><div class="compare-box"><h4>Χρονική αύξηση</h4><p>ἄρχω → ἦρχον</p><p>ὁρίζω → ὥριζον</p></div></div><div class="notice">Παρατατικός, αόριστος και υπερσυντέλικος παίρνουν αύξηση στην οριστική.</div></section>'+genericQuizBox(unitByNo(7))
