function dashboard(){var d=load(),done=Object.keys(d.progress||{}).filter(function(k){return d.progress[k]}).length+(d.quiz?1:0),pct=Math.min(100,Math.round(done/5*100));return '<div class="fade">'+header()+'<section class="hero"><div class="hero-in"><div><div class="eyebrow">Αρχαία Ελληνική Γλώσσα • Α΄ Γυμνασίου</div><h1>Καλωσόρισες, '+st.u.name+'.</h1><p>Συνέχισε το ταξίδι στον κόσμο της ελληνικής γλώσσας, από τις αρχαιότερες μαρτυρίες έως τη σημερινή της μορφή.</p><div class="quote">«Η γλώσσα είναι ο δρόμος προς τον τρόπο που οι άνθρωποι σκέφτονται, ζουν και δημιουργούν.»</div><div class="hero-actions"><button class="btn primary" onclick="go(\'unit\')">Συνέχεια μαθήματος →</button><button class="btn ghost" onclick="go(\'live\')">▣ Μετάβαση στην τάξη</button></div></div><aside class="hero-panel"><div class="tag">ΤΡΕΧΟΝ ΜΑΘΗΜΑ</div><h3>Ενότητα 1</h3><strong>Το ταξίδι των λέξεων στον χρόνο</strong><p>Γλώσσα, αλφάβητο, διάλεκτοι και η ιστορική συνέχεια της ελληνικής.</p><div class="prog-label"><span>Πρόοδος</span><b>'+pct+'%</b></div><div class="progress"><i style="width:'+pct+'%"></i></div><div class="hero-stats"><div class="hero-stat"><b>4</b><span>βήματα</span></div><div class="hero-stat"><b>10</b><span>ερωτήσεις</span></div><div class="hero-stat"><b>35′</b><span>διάρκεια</span></div></div></aside></div></section><main class="main"><div class="action-grid">'+feature("fi-book","Μαθήματα","Κείμενα, λεξιλόγιο, γραμματική, σύνταξη.","content")+feature("fi-bust","Αξιολόγηση","Quiz και άμεση ανατροφοδότηση.","unit")+feature("fi-scroll","Λεξικό","Αναζήτηση λέξεων της αρχαίας ελληνικής.","dictionary")+feature("fi-class","Η τάξη μου","Live δραστηριότητες και συνεργατική μάθηση.","live")+'</div><section class="section"><div class="section-head"><div><h2>Συνέχισε από εδώ</h2><p>Η πρώτη ολοκληρωμένη μαθησιακή διαδρομή.</p></div></div><div class="dashboard-grid"><article class="current"><div class="current-art"></div><div class="current-copy"><div class="tag">ΤΡΕΧΟΝ ΜΑΘΗΜΑ</di function bind(){if(st.p==="unit"){all("[data-m]").forEach(function(r){all("[data-c]",r).forEach(function(b){b.onclick=function(){all("[data-c]",r).forEach(function(x){x.classList.remove("good","bad")});b.classList.add(b.getAttribute("data-c")===r.getAttribute("data-a")?"good":"bad");if(all("[data-m]").every(function(x){return x.querySelector(".good")}))el("#mm").innerHTML='<div class="notice good" style="margin-top:10px">4/4 — Βρήκες όλες τις σωστές αντιστοιχίσεις.</div>'}})});var qf=el("#quiz");if(qf)qf.onsubmit=function(e){e.preventDefault();var s=0,a=0;quiz.forEach(function(q,i){var x=e.target.querySelector('input[name="q'+i+'"]:checked');if(x){a++;if(x.value===q[2])s++}});if(a<10){el("#qr").innerHTML='<div class="notice" style="margin-top:12px">Απάντησε και στις 10 ερωτήσεις.</div>';return}var d=load(),pc=s*10,pass=pc>=70;d.quiz={score:s,percent:pc,passed:pass};save(d);el("#qr").innerHTML='<div class="notice '+(pass?"good":"")+'" style="margin-top:12px"><b>'+pc+'% • '+s+'/10 σωστές</b><br>'+(pass?"Η ενότητα ολοκληρώθηκε με επιτυχία.":"Χρειάζεται μια ακόμη επανάληψη στα βασικά σημεία.")+'</div>'}}if(st.p==="live"){var start=el("#start");if(start)start.onclick=function(){st.live=true;render()};var send=el("#send");if(send)send.onclick=function(){st.activity={q:el("#lq").value,opts:["ὁ","λόγος","γράφω","σοφός"],correct:el("#corr").value};render()};all("[data-ans]").forEach(function(b){b.onclick=function(){if(st.u.role!=="student")return;all("[data-ans]").forEach(function(x){x.classList.remove("sel")});b.classList.add("sel");var ok=b.getAttribute("data-ans")===st.activity.correct;el("#studentmsg").innerHTML='<div class="notice '+(ok?"good":"")+'">'+(ok?"Σωστά!":"Η απάντηση καταχωρίστηκε.")+'</div>'}})}}
function render(){if(!st.u){el("#root").innerHTML=loginPage();return}var body=st.p==="content"?content():st.p==="unit"?unitPage():st.p==="live"?livePage():st.p==="admin"&&st.u.role==="super_admin"?admin():st.p==="dictionary"?placeholder("Λεξικό","Αναζήτηση και εξερεύνηση λέξεων της Αρχαίας Ελληνικής με σύνδεση στις πηγές του project."):st.p==="grammar"?placeholder("Γραμματική","Οργανωμένη γραμματική αναφορά με παραδείγματα και μικρές δραστηριότητες."):dashboard();el("#root").innerHTML=body;bind()}
