function lesson3(){return '<section class="lesson"><div class="step"><div class="icon">Α</div><div><div class="k">3. Το ελληνικό αλφάβητο</div><h2>Από το φοινικικό σύστημα σε φωνολογικό αλφάβητο</h2><p class="muted">Η προσαρμογή επέτρεψε σαφή απόδοση φωνηέντων και συμφώνων.</p></div></div><div class="notice">Δοκιμή: μόνο με τα σύμφωνα <b>Μ-Θ-Τ-Σ</b>, πόσο εύκολα ξεχωρίζεις «μαθητής / μαθητές / μαθητάς» χωρίς συμφραζόμενα;</div><p class="muted"><b>Αρχαιότερα αλφαβητικά μνημεία:</b> η οινοχόη του Διπύλου και το ποτήρι του Νέστορος.</p>'+foot("alphabet")+'</section>'}
function lesson4(){return '<section class="lesson"><div class="step"><div class="icon">◇</div><div><div class="k">4. Διάλεκτοι και Κοινή</div><h2>Ποικιλία που οδηγεί σε ευρύτερη κοινή μορφή</h2><p class="muted">Η Αρχαία Ελληνική παρουσίαζε διαλεκτική ποικιλία. Από τον 4ο αι. π.Χ. η Αττική άρχισε να επικρατεί.</p></div></div><div class="dialects"><div class="dialect"><b>Ιωνική–Αττική</b><p class="muted">Ιδιαίτερη καλλιέργεια στην Αθήνα.</p></div><div class="dialect"><b>Αρκαδοκυπριακή</b><p class="muted">Αρχαία διαλεκτική ομάδα.</p></div><div class="dialect"><b>Αιολική</b><p class="muted">Λεσβιακά, θεσσαλικά, βοιωτικά στοιχεία.</p></div><div class="dialect"><b>Δυτική / Δωρική</b><p class="muted">Στη δωρική είναι γραμμένος ο Νόμος της Γόρτυνας.</p></div></div><div class="notice">Ίχνη σήμερα: Τσακωνική «μάτη» &lt; μάτηρ • Κρητική «χοχλιός» &lt; κοχλίας • Κυπριακή «έδοξέν μου» &lt; ἔδοξέ μοι.</div><div style="margin-top:13px">'+foot("dialects")+'</div></section>'}
function quizBox(){var d=load(),qs=quiz.map(function(q,i){return '<fieldset class="quizq"><legend>'+(i+1)+'. '+q[0]+'</legend>'+q[1].map(function(o){return '<label><input type="radio" name="q'+i+'" value="'+o.replace(/"/g,"&quot;")+'"> '+o+'</label>'}).join("")+'</fieldset>'}).join("");return '<section class="lesson"><div class="step"><div class="icon">✓</div><div><div class="k">Αξιολόγηση</div><h2>Τελικός έλεγχος — 10 ερωτήσεις</h2><p class="muted">Στόχος επιτυχίας: 70% ή περισσότερο.</p></div></div>'+(d.quiz?'<div class="notice '+(d.quiz.passed?"good":"")+'">Τελευταία προσπάθεια: <b>'+d.quiz.score+'/10 • '+d.quiz.percent+'%</b></div>':"")+'<form id="quiz">'+qs+'<button class="btn" type="submit">Υποβολή τελικού ελέγχου</button><div id="qr"></div></form></section>'}
function unitPage(){var d=load(),n=["continuity","words","alphabet","dialects"].filter(done).length+(d.quiz?1:0),pct=Math.round(n/5*100);return '<button class="btn alt" onclick="go(\'content\')">← Μαθήματα</button><section class="lessonhero" style="margin-top:11px"><div class="k">Ενότητα 1</div><h1>Το ταξίδι των λέξεων στον χρόνο</h1><p class="muted">Από τις πρώτες μαρτυρίες της ελληνικής έως τη γλώσσα που μιλάμε σήμερα.</p><div class="progress"><b style="width:'+pct+'%"></b></div><div class="principles"><span>Πρόοδος '+pct+'%</span><span>≈35 λεπτά</span></div></section><div class="objectives"><div class="obj">Σχέση Αρχαίας και Νέας Ελληνικής.</div><div class="obj">Ελληνικές ρίζες σε άλλες γλώσσες.</div><div class="obj">Προσαρμογή του αλφαβήτου.</div><div class="obj">Βασικοί ιστορικοί σταθμοί.</div><div class="obj">Βασικές διαλεκτικές ομάδες.</div></div>'+lesson1()+lesson2()+lesson3()+lesson4()+quizBox()+'<div class="notice" style="margin-top:13px">Το περιεχόμενο είναι επαναδιατυπωμένο και οι δραστηριότητες πρωτότυπες. Δεν αναπαράγονται σαρωμένες σελίδες ή εικόνες βιβλίου.</div>'}
function livePage(){var students=users.filter(function(u){return u.role==="student"}),isT=st.u.role!=="student";var roster=students.map(function(s){return '<div class="person"><div class="avatar">'+s.name.charAt(0)+'</div><div><b>'+s.name+'</b><div class="muted" style="font-size:11px">'+s.email+'</div></div><span class="dot '+(st.online.indexOf(s.id)>=0?"on":"")+'"></span></div>'}).join("");var board=st.activity?'<div class="question">'+st.activity.q+'</div><div class="opts">'+st.activity.opts.map(function(o){return '<button class="opt" data-ans="'+o+'">'+o+'</button>'}).join("")+'</div><div id="studentmsg" style="margin-top:11px"></div>':'<div style="text-align:center;padding:65px 10px"><h3 style="font:26px Georgia;color:var(--n)">Η τάξη είναι έτοιμη.</h3><p class="muted">Η live ερώτηση εμφανίζεται εδώ για όλους.</p></div>';var tools=isT?'<div class="k">Εργαλεία καθηγητή</div><h3 style="font:22px Georgia;color:var(--n)">Νέα live ερώτηση</h3><div class="field"><label>Ερώτηση</label><input id="lq" value="Ποιο από τα παρακάτω είναι άρθρο;"></div><div class="field"><label>Σωστή απάντηση</label><select id="corr"><option>ὁ</option><option>λόγος</option><option>γράφω</option><option>σοφός</option></select></div><button class="btn green" id="send">Αποστολή σε όλους</button>':'<div class="k">Η συμμετοχή μου</div><h3 style="font:22px Georgia;color:var(--n)">Live μάθημα</h3><p class="muted">Ο καθηγητής βλέπει την ατομική απάντηση. Οι συμμαθητές βλέπουν ποιοι είναι μέσα.</p>';return '<section class="section" style="margin-top:0"><div class="sectionhead"><div><h2>Ζωντανή τάξη</h2><p>Αρχαία Α΄ — Τάξη Α1 • BigBlueButton integration layer</p></div>'+(isT&&!st.live?'<button class="btn" id="start">Έναρξη BBB demo</button>':'<span class="chip">'+(st.live?"Live σε εξέλιξη":"Αναμονή για μάθημα")+'</span>')+'</div><div class="live"><aside class="panel"><div class="k">Πίνακας τάξης</div><h3 style="font:22px Georgia;color:var(--n)">6 μαθητές</h3><div class="notice"><b>'+st.online.length+'</b> online</div>'+roster+'</aside><section class="panel"><div class="k">Κοινή δραστηριότητα</div>'+board+'</section><aside class="panel">'+tools+'</aside></div></section>'}
function admin(){return '<section class="section" style="margin-top:0"><div class="sectionhead"><div><h2>Super Admin</h2><p>Κεντρική διαχείριση The Greek Online School.</p></div></div><div class="grid"><div class="card"><div class="k">Χρήστες</div><div class="metric">9</div></div><div class="card"><div class="k">Καθηγητές</div><div class="metric">1</div></div><div class="card"><div class="k">Μαθητές</div><div class="metric">6</div></div><div class="card"><div class="k">Τάξεις</div><div class="metric">1</div></div></div><section class="section"><div class="sectionhead"><div><h2>Χρήστες</h2><p>Στο production οι ρόλοι ελέγχονται αποκλειστικά server-side.</p></div></div><div class="table"><table><thead><tr><th>Όνομα</th><th>Email</th><th>Ρόλος</th></tr></thead><tbody>'+users.map(function(u){return '<tr><td>'+u.name+'</td><td>'+u.email+'</td><td>'+roleName[u.role]+'</td></tr>'}).join("")+'</tbody></table></div></section></section>'}
function bind(){var sw=el("#switch");if(sw){sw.value=st.u.id==="pan"?"pan":st.u.id==="teacher"?"teacher":"maria";sw.onchange=function(){login(sw.value)}}if(st.p==="unit"){all("[data-m]").forEach(function(r){all("[data-c]",r).forEach(function(b){b.onclick=function(){all("[data-c]",r).forEach(function(x){x.classList.remove("good","bad")});b.classList.add(b.getAttribute("data-c")===r.getAttribute("data-a")?"good":"bad");if(all("[data-m]").every(function(x){return x.querySelector(".good")}))el("#mm").innerHTML='<div class="notice good" style="margin-top:9px">4/4 — Βρήκες όλες τις διαδρομές.</div>'}})});el("#quiz").onsubmit=function(e){e.preventDefault();var s=0,a=0;quiz.forEach(function(q,i){var x=e.target.querySelector('input[name="q'+i+'"]:checked');if(x){a++;if(x.value===q[2])s++}});if(a<10){el("#qr").innerHTML='<div class="notice" style="margin-top:10px">Απάντησε και στις 10 ερωτήσεις.</div>';return}var d=load(),pct=s*10,pass=pct>=70;d.quiz={score:s,percent:pct,passed:pass};save(d);el("#qr").innerHTML='<div class="score '+(pass?"good":"")+'"><div class="metric">'+pct+'%</div><b>'+s+'/10 σωστές</b><p>'+(pass?"Η ενότητα ολοκληρώθηκε με επιτυχία.":"Δες ξανά τα σημεία που χρειάζονται προσοχή.")+'</p></div>'}}if(st.p==="live"){var start=el("#start");if(start)start.onclick=function(){st.live=true;render()};var send=el("#send");if(send)send.onclick=function(){st.activity={q:el("#lq").value,opts:["ὁ","λόγος","γράφω","σοφός"],correct:el("#corr").value};render()};all("[data-ans]").forEach(function(b){b.onclick=function(){if(st.u.role!=="student")return;all("[data-ans]").forEach(function(x){x.classList.remove("sel")});b.classList.add("sel");var ok=b.getAttribute("data-ans")===st.activity.correct;el("#studentmsg").innerHTML='<div class="notice '+(ok?"good":"")+'">'+(ok?"Σωστά!":"Η απάντηση καταχωρίστηκε.")+'</div>'}})}}
function render(){if(!st.u){el("#root").innerHTML=loginPage();return}var body=st.p==="content"?content():st.p==="unit"?unitPage():st.p==="live"?livePage():st.p==="admin"&&st.u.role==="super_admin"?admin():dashboard();el("#root").innerHTML=shell(body);bind()}
(function(){var q=new URLSearchParams(location.search).get("demo"),map={panagiotis:"pan",super_admin:"pan",teacher:"teacher",student:"maria",maria:"maria"};if(q&&map[q])localStorage.setItem(S,map[q]);var id=localStorage.getItem(S);st.u=users.find(function(x){return x.id===id})||null;render()})();
</script></body></html>
